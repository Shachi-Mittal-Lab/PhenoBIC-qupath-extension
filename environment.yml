# Conda environment for PhenoBIC phenotype inference (GPU).
# Create with: conda env create -f environment.yml

name: PhenoBIC_GPU
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pandas
  # TF 2.14 requires NumPy 1.x; NumPy 2.x causes AttributeError/TypeError on import
  - "numpy>=1.24,<2"
  - tifffile
  - zarr
  - pillow
  - pip:
    # TF 2.14 avoids known .keras zip load bug (ValueError: "accessible .keras zip file")
    # See: https://stackoverflow.com/questions/77993956
    - tensorflow==2.14.0
    # BioIO for OME-TIFF (avoids channels-as-samples dimension errors; see bioio-devs/bioio-ome-tiff#14)
    - bioio
    - bioio-ome-tiff
    - psutil
    # zarr 2.x needs cbuffer_sizes/cbuffer_metainfo; numcodecs>=0.16 removed them (gh#721)
    - "numcodecs<0.16"
